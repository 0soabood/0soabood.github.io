# Tag permalinks are RELATIVE segments: the blog plugin always prefixes
# `<routeBasePath>/<tagsBasePath>`, so a permalink of `/ai` resolves to
# `/parrot/tags/ai`. Declaring it as `/parrot/ai` would resolve to the
# doubled path `/parrot/tags/parrot/ai`. Keep these values as bare segments.
ai-generated:
  label: AI-Generated
  permalink: /ai-generated
  description: Content fully generated by AI

